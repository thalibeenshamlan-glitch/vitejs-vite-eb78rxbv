                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               if(!found) html+='<p class="small">No recorded absences.</p>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  html+='</div>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      html+='<h3>Not Marked</h3>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        selectedPrayers.forEach(p=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           html+=`<div class="statusList"><b>${prayerNames[p]}</b>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              let found=false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 const dates=[];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const cursor=new Date(range.start+"T00:00:00");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       const last=new Date(range.end+"T00:00:00");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          while(cursor<=last){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              dates.push(localDateFrom(cursor));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  cursor.setDate(cursor.getDate()+1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        dates.forEach(day=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            approvedMembers.forEach(member=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 const r=recordsByMemberDate[member.id+"_"+day];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if(getStatus(r,p)==="notmarked"){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            html+=`<p class="notmarked">${escapeHTML(member.name)} — ${day}</p>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  found=true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 if(!found) html+='<p class="small">No unmarked records.</p>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    html+='</div>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        area.innerHTML=html;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         }catch(error){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           area.textContent="Report error: "+error.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            $("loadMosqueReport").onclick=loadMosqueReport;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            $("mosquePeriod").onchange=loadMosqueReport;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            $("mosqueReportDate").onchange=loadMosqueReport;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            $("mosquePrayer").onchange=loadMosqueReport;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // END OF PART 3
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                       </html>
