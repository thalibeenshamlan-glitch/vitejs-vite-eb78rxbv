
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SALAH TRACK</title>
<style>
*{box-sizing:border-box}
body{background:#07130f;color:white;font-family:Arial,sans-serif;text-align:center;padding:12px}
.container{max-width:700px;margin:20px auto;background:#10251c;padding:18px;border-radius:14px}
h1,h2,h3{color:#d7b66a}
input,select{width:95%;padding:12px;margin:7px 0;background:#07130f;color:white;border:1px solid #294438;border-radius:7px}
button{width:100%;padding:12px;margin:7px 0;background:#0e704b;color:white;border:0;border-radius:7px;font-weight:bold}
button:disabled{opacity:.5}
.secondary{background:#344b3d}
.hidden{display:none}
.member{background:#0a1b13;padding:14px;margin:10px 0;border:1px solid #294438;border-radius:9px;text-align:left}
.small{color:#a9b8ad;font-size:13px}
.prayers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.prayer{background:#10251c;padding:9px;border-radius:7px;font-size:13px}
.prayer select{width:100%;padding:8px;margin:5px 0}
.present{color:#64d69a;font-weight:bold}
.absent{color:#ff8b8b;font-weight:bold}
.notmarked{color:#d7b66a;font-weight:bold}
.reportStat{background:#0a1b13;border:1px solid #294438;border-radius:9px;padding:12px;margin:5px}
.reportGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.reportTable{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.reportTable th,.reportTable td{border:1px solid #294438;padding:8px}
.reportTable th{background:#183729;color:#d7b66a}
.reportTable td{background:#0a1b13}
.scroll{overflow-x:auto}
.statusList{text-align:left;background:#0a1b13;border:1px solid #294438;padding:12px;border-radius:8px;margin:8px 0}
</style>
</head>
<body>
<h1>SALAH TRACK</h1>
<h2>الصَّلَاةُ عِمَادُ الدِّينِ</h2>
<p>Prayer Attendance Management</p>

<div class="container" id="authPanel">
 <div id="loginPanel">
   <h2>Sign In</h2>
     <input id="loginEmail" type="email" placeholder="Email address">
       <input id="loginPassword" type="password" placeholder="Password">
         <button id="loginButton">Sign In</button>
           <button class="secondary" id="showRegister">Create Account</button>
            </div>
             <div id="registerPanel" class="hidden">
               <h2>Create Account</h2>
                 <input id="registerName" placeholder="Full Name">
                   <input id="registerUsername" placeholder="Username">
                     <input id="registerEmail" type="email" placeholder="Email Address">
                       <input id="registerPassword" type="password" placeholder="Password">
                         <input id="confirmPassword" type="password" placeholder="Confirm Password">
                           <label><input type="checkbox" id="showPassword" style="width:auto"> Show Password</label>
                             <button id="registerButton">Register</button>
                               <button class="secondary" id="showLogin">Back to Login</button>
                                </div>
                                 <div id="message"></div>
                                 </div>

                                 <div class="container hidden" id="dashboard">
                                  <h2 id="dashboardTitle"></h2>
                                   <p id="accountName"></p>
                                    <p id="accountUsername"></p>
                                     <p id="accountEmail"></p>
                                      <p id="accountRole"></p>

                                       <div id="adminPanel" class="hidden">
                                         <hr><h2>Member & Mentor Approval</h2>
                                           <button id="refreshPending" class="secondary">Refresh Requests</button>
                                             <div id="pendingList"></div>
                                              </div>

                                               <div id="attendancePanel" class="hidden">
                                                 <hr><h2>Prayer Attendance</h2>
                                                   <input type="date" id="attendanceDate">
                                                     <button id="loadAttendance">Load Members</button>
                                                       <div id="attendanceList"></div>
                                                        </div>

                                                         <div id="mosqueReportPanel" class="hidden">
                                                           <hr><h2>Mosque Attendance Reports</h2>
                                                             <label>Report Period</label>
                                                               <select id="mosquePeriod">
                                                                  <option value="daily">Daily Report</option>
                                                                     <option value="weekly">Weekly Report</option>
                                                                        <option value="monthly">Monthly Report</option>
                                                                          </select>
                                                                            <label>Choose Date</label>
                                                                              <input type="date" id="mosqueReportDate">
                                                                                <label>Prayer</label>
                                                                                  <select id="mosquePrayer">
                                                                                     <option value="all">All Prayers</option>
                                                                                        <option value="fajr">Fajr - الفجر</option>
                                                                                           <option value="dhuhr">Dhuhr - الظهر</option>
                                                                                              <option value="asr">Asr - العصر</option>
                                                                                                 <option value="maghrib">Maghrib - المغرب</option>
                                                                                                    <option value="isha">Isha - العشاء</option>
                                                                                                      </select>
                                                                                                        <button id="loadMosqueReport">Generate Report</button>
                                                                                                          <div id="mosqueReportResults"></div>
                                                                                                           </div>

                                                                                                            <div id="reportPanel" class="hidden">
                                                                                                              <hr><h2>My Attendance Report</h2>
                                                                                                                <select id="reportPeriod">
                                                                                                                   <option value="daily">Daily Report</option>
                                                                                                                      <option value="weekly">Weekly Report</option>
                                                                                                                         <option value="monthly">Monthly Report</option>
                                                                                                                           </select>
                                                                                                                             <input type="date" id="myReportDate">
                                                                                                                               <button id="loadMyReport">Generate My Report</button>
                                                                                                                                 <div id="reportList"></div>
                                                                                                                                  </div>
                                                                                                                                   <button id="logoutButton" class="secondary">Sign Out</button>
                                                                                                                                   </div>

                                                                                                                                   <div class="container hidden" id="pendingPanel">
                                                                                                                                    <h2>Approval Pending</h2>
                                                                                                                                     <p>Your account is waiting for Admin approval.</p>
                                                                                                                                      <p>يرجى انتظار موافقة المسؤول</p>
                                                                                                                                       <button id="pendingLogout" class="secondary">Sign Out</button>
                                                                                                                                       </div>
                                                 
                                                 <script type="module">
                                                 import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
                                                 import {
                                                  getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,
                                                   signOut,onAuthStateChanged
                                                   } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
                                                   import {
                                                    getFirestore,doc,setDoc,getDoc,updateDoc,collection,getDocs,
                                                     query,where,serverTimestamp
                                                     } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
                                                     
                                                     const firebaseConfig={
                                                      apiKey:"AIzaSyC3eD8SDKjRWrU9XgnYU5CHdQTW-QrUf20",
                                                       authDomain:"salah-track-f2bbc.firebaseapp.com",
                                                        projectId:"salah-track-f2bbc",
                                                         storageBucket:"salah-track-f2bbc.firebasestorage.app",
                                                          messagingSenderId:"492055408699",
                                                           appId:"1:492055408699:web:33e29156337f8daf936c1e"
                                                           };
                                                           
                                                           const app=initializeApp(firebaseConfig);
                                                           const auth=getAuth(app);
                                                           const db=getFirestore(app);
                                                           
                                                           const $=id=>document.getElementById(id);
                                                           const prayers=["fajr","dhuhr","asr","maghrib","isha"];
                                                           const prayerNames={
                                                            fajr:"Fajr - الفجر",
                                                             dhuhr:"Dhuhr - الظهر",
                                                              asr:"Asr - العصر",
                                                               maghrib:"Maghrib - المغرب",
                                                                isha:"Isha - العشاء"
                                                                };
                                                                
                                                                let currentUser=null;
                                                                let currentProfile=null;
                                                                let currentRole="";
                                                                let members=[];
                                                                
                                                                function localDate(){
                                                                 const d=new Date();
                                                                  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
                                                                  }
                                                                  function escapeHTML(value){
                                                                   return String(value??"").replace(/[&<>"']/g,c=>({
                                                                    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
                                                                     })[c]);
                                                                     }
                                                                     function message(text){
                                                                      $("message").textContent=text;
                                                                      }
                                                                      function show(id,yes=true){
                                                                       $(id).classList.toggle("hidden",!yes);
                                                                       }
                                                                       function showDashboard(profile){
                                                                        show("authPanel",false);
                                                                         show("pendingPanel",false);
                                                                          show("dashboard",true);
                                                                           $("dashboardTitle").textContent="Welcome to SALAH TRACK";
                                                                            $("accountName").textContent="Name: "+(profile.name||"");
                                                                             $("accountUsername").textContent="Username: "+(profile.username||"");
                                                                              $("accountEmail").textContent="Email: "+(profile.email||"");
                                                                               $("accountRole").textContent="Role: "+currentRole.toUpperCase();
                                                                                show("adminPanel",currentRole==="admin");
                                                                                 show("attendancePanel",currentRole==="admin");
                                                                                  show("mosqueReportPanel",currentRole==="admin"||currentRole==="mentor");
                                                                                   show("reportPanel",currentRole==="member");
                                                                                    if(currentRole==="admin") loadPending();
                                                                                     if(currentRole==="member") loadMyReport();
                                                                                     }
                                                                                     async function logout(){
                                                                                      await signOut(auth);
                                                                                       currentUser=null;
                                                                                        currentProfile=null;
                                                                                         currentRole="";
                                                                                          show("dashboard",false);
                                                                                           show("pendingPanel",false);
                                                                                            show("authPanel",true);
                                                                                             show("loginPanel",true);
                                                                                              show("registerPanel",false);
                                                                                               message("");
                                                                                               }
                                                                                               $("showRegister").onclick=()=>{
                                                                                                show("loginPanel",false);
                                                                                                 show("registerPanel",true);
                                                                                                  message("");
                                                                                                  };
                                                                                                  $("showLogin").onclick=()=>{
                                                                                                   show("registerPanel",false);
                                                                                                    show("loginPanel",true);
                                                                                                     message("");
                                                                                                     };
                                                                                                     $("showPassword").onchange=()=>{
                                                                                                      const type=$("showPassword").checked?"text":"password";
                                                                                                       $("registerPassword").type=type;
                                                                                                        $("confirmPassword").type=type;
                                                                                                        };
                                                                                                        
                                                                                                        $("registerButton").onclick=async()=>{
                                                                                                         const name=$("registerName").value.trim();
                                                                                                          const username=$("registerUsername").value.trim();
                                                                                                           const email=$("registerEmail").value.trim();
                                                                                                            const password=$("registerPassword").value;
                                                                                                             const confirm=$("confirmPassword").value;
                                                                                                              if(!name||!username||!email||!password||!confirm){
                                                                                                                message("Please fill in all fields.");
                                                                                                                  return;
                                                                                                                   }
                                                                                                                    if(password!==confirm){
                                                                                                                      message("Passwords do not match.");
                                                                                                                        return;
                                                                                                                         }
                                                                                                                          if(password.length<6){
                                                                                                                            message("Password must contain at least 6 characters.");
                                                                                                                              return;
                                                                                                                               }
                                                                                                                                try{
                                                                                                                                  const result=await createUserWithEmailAndPassword(auth,email,password);
                                                                                                                                    await setDoc(doc(db,"users",result.user.uid),{
                                                                                                                                       name,username,email,role:"member",approved:false
                                                                                                                                         });
                                                                                                                                           await signOut(auth);
                                                                                                                                             message("Registration successful. Please wait for Admin approval.");
                                                                                                                                               show("registerPanel",false);
                                                                                                                                                 show("loginPanel",true);
                                                                                                                                                  }catch(error){
                                                                                                                                                    message(error.message);
                                                                                                                                                     }
                                                                                                                                                     };
                                                                                                                                                     
                                                                                                                                                     $("loginButton").onclick=async()=>{
                                                                                                                                                      const email=$("loginEmail").value.trim();
                                                                                                                                                       const password=$("loginPassword").value;
                                                                                                                                                        if(!email||!password){
                                                                                                                                                          message("Enter your email and password.");
                                                                                                                                                            return;
                                                                                                                                                             }
                                                                                                                                                              try{
                                                                                                                                                                await signInWithEmailAndPassword(auth,email,password);
                                                                                                                                                                  message("");
                                                                                                                                                                   }catch(error){
                                                                                                                                                                     message("Login failed: "+error.message);
                                                                                                                                                                      }
                                                                                                                                                                      };
                                                                                                                                                                      
                                                                                                                                                                      onAuthStateChanged(auth,async user=>{
                                                                                                                                                                       if(!user){
                                                                                                                                                                         currentUser=null;
                                                                                                                                                                           currentProfile=null;
                                                                                                                                                                             currentRole="";
                                                                                                                                                                               show("dashboard",false);
                                                                                                                                                                                 show("pendingPanel",false);
                                                                                                                                                                                   show("authPanel",true);
                                                                                                                                                                                     return;
                                                                                                                                                                                      }
                                                                                                                                                                                       currentUser=user;
                                                                                                                                                                                        try{
                                                                                                                                                                                          const snap=await getDoc(doc(db,"users",user.uid));
                                                                                                                                                                                            if(!snap.exists()){
                                                                                                                                                                                               message("User profile not found. Contact Admin.");
                                                                                                                                                                                                  await signOut(auth);
                                                                                                                                                                                                     return;
                                                                                                                                                                                                       }
                                                                                                                                                                                                         currentProfile=snap.data();
                                                                                                                                                                                                           currentRole=currentProfile.role||"member";
                                                                                                                                                                                                             if(!currentProfile.approved){
                                                                                                                                                                                                                show("authPanel",false);
                                                                                                                                                                                                                   show("dashboard",false);
                                                                                                                                                                                                                      show("pendingPanel",true);
                                                                                                                                                                                                                         return;
                                                                                                                                                                                                                           }
                                                                                                                                                                                                                             showDashboard(currentProfile);
                                                                                                                                                                                                                              }catch(error){
                                                                                                                                                                                                                                message("Unable to load account: "+error.message);
                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                 });
                                                                                                                                                                                                                                 
                                                                                                                                                                                                                                 $("logoutButton").onclick=logout;
                                                                                                                                                                                                                                 $("pendingLogout").onclick=logout;
                                                                                                                                                                                                                                 
                                                                                                                                                                                                                                 async function loadPending(){
                                                                                                                                                                                                                                  const area=$("pendingList");
                                                                                                                                                                                                                                   area.textContent="Loading...";
                                                                                                                                                                                                                                    try{
                                                                                                                                                                                                                                      const q=query(collection(db,"users"),where("approved","==",false));
                                                                                                                                                                                                                                        const snap=await getDocs(q);
                                                                                                                                                                                                                                          area.innerHTML="";
                                                                                                                                                                                                                                            if(snap.empty){
                                                                                                                                                                                                                                               area.textContent="No pending requests.";
                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                      snap.forEach(item=>{
                                                                                                                                                                                                                                                         const data=item.data();
                                                                                                                                                                                                                                                            const card=document.createElement("div");
                                                                                                                                                                                                                                                               card.className="member";
                                                                                                                                                                                                                                                                  card.innerHTML=`
                                                                                                                                                                                                                                                                      <b>${escapeHTML(data.name)}</b><br>
                                                                                                                                                                                                                                                                          Username: ${escapeHTML(data.username)}<br>
                                                                                                                                                                                                                                                                              Email: ${escapeHTML(data.email)}<br>
                                                                                                                                                                                                                                                                                  <select class="roleChoice">
                                                                                                                                                                                                                                                                                       <option value="member">Approve as Member</option>
                                                                                                                                                                                                                                                                                            <option value="mentor">Approve as Mentor</option>
                                                                                                                                                                                                                                                                                                </select>
                                                                                                                                                                                                                                                                                                    <button class="approveButton">Approve Account</button>`;
                                                                                                                                                                                                                                                                                                       card.querySelector(".approveButton").onclick=async()=>{
                                                                                                                                                                                                                                                                                                           const role=card.querySelector(".roleChoice").value;
                                                                                                                                                                                                                                                                                                               try{
                                                                                                                                                                                                                                                                                                                    await updateDoc(doc(db,"users",item.id),{
                                                                                                                                                                                                                                                                                                                          role,approved:true
                                                                                                                                                                                                                                                                                                                               });
                                                                                                                                                                                                                                                                                                                                    card.remove();
                                                                                                                                                                                                                                                                                                                                         if(!area.children.length) area.textContent="No pending requests.";
                                                                                                                                                                                                                                                                                                                                             }catch(error){
                                                                                                                                                                                                                                                                                                                                                  alert("Approval failed: "+error.message);
                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                         };
                                                                                                                                                                                                                                                                                                                                                            area.appendChild(card);
                                                                                                                                                                                                                                                                                                                                                              });
                                                                                                                                                                                                                                                                                                                                                               }catch(error){
                                                                                                                                                                                                                                                                                                                                                                 area.textContent="Error: "+error.message;
                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                  $("refreshPending").onclick=loadPending;
                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                  $("attendanceDate").value=localDate();
                                                                                                                                                                                                                                                                                                                                                                  $("mosqueReportDate").value=localDate();
                                                                                                                                                                                                                                                                                                                                                                  $("myReportDate").value=localDate();
                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                  $("loadAttendance").onclick=loadAttendance;
                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                  async function loadAttendance(){
                                                                                                                                                                                                                                                                                                                                                                   if(currentRole!=="admin") return;
                                                                                                                                                                                                                                                                                                                                                                    const area=$("attendanceList");
                                                                                                                                                                                                                                                                                                                                                                     area.textContent="Loading members...";
                                                                                                                                                                                                                                                                                                                                                                      const date=$("attendanceDate").value;
                                                                                                                                                                                                                                                                                                                                                                       if(!date){
                                                                                                                                                                                                                                                                                                                                                                         area.textContent="Choose a date.";
                                                                                                                                                                                                                                                                                                                                                                           return;
                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                             try{
                                                                                                                                                                                                                                                                                                                                                                               const snap=await getDocs(collection(db,"users"));
                                                                                                                                                                                                                                                                                                                                                                                 members=[];
                                                                                                                                                                                                                                                                                                                                                                                   snap.forEach(item=>{
                                                                                                                                                                                                                                                                                                                                                                                      const data=item.data();
                                                                                                                                                                                                                                                                                                                                                                                         if(data.approved&&data.role==="member"){
                                                                                                                                                                                                                                                                                                                                                                                             members.push({id:item.id,...data});
                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                    area.innerHTML="";
                                                                                                                                                                                                                                                                                                                                                                                                      if(!members.length){
                                                                                                                                                                                                                                                                                                                                                                                                         area.textContent="No approved members found.";
                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                for(const member of members){
                                                                                                                                                                                                                                                                                                                                                                                                                   const recordId=member.id+"_"+date;
                                                                                                                                                                                                                                                                                                                                                                                                                      const recordSnap=await getDoc(doc(db,"attendance",recordId));
                                                                                                                                                                                                                                                                                                                                                                                                                         const saved=recordSnap.exists()?recordSnap.data().prayers||{}:{};
                                                                                                                                                                                                                                                                                                                                                                                                                            const card=document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                               card.className="member";
                                                                                                                                                                                                                                                                                                                                                                                                                                  let html=`<b>${escapeHTML(member.name)}</b><br>
                                                                                                                                                                                                                                                                                                                                                                                                                                      <span class="small">@${escapeHTML(member.username)}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="prayers">`;
                                                                                                                                                                                                                                                                                                                                                                                                                                             for(const p of prayers){
                                                                                                                                                                                                                                                                                                                                                                                                                                                 const value=saved[p]===true?"present":saved[p]===false?"absent":"";
                                                                                                                                                                                                                                                                                                                                                                                                                                                     html+=`<div class="prayer">${prayerNames[p]}
                                                                                                                                                                                                                                                                                                                                                                                                                                                          <select data-prayer="${p}">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="" ${value===""?"selected":""}>Not Marked</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <option value="present" ${value==="present"?"selected":""}>Present</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="absent" ${value==="absent"?"selected":""}>Absent</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 </select></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       html+=`</div><button class="saveAttendance">Save Attendance</button>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          card.innerHTML=html;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             card.querySelector(".saveAttendance").onclick=async()=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 const prayerData={};
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     card.querySelectorAll("[data-prayer]").forEach(select=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if(select.value==="present") prayerData[select.dataset.prayer]=true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               if(select.value==="absent") prayerData[select.dataset.prayer]=false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       try{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            await setDoc(doc(db,"attendance",recordId),{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  memberId:member.id,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        date,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              prayers:prayerData,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    updatedBy:currentUser.uid,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          updatedAt:serverTimestamp()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alert("Attendance saved for "+member.name);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }catch(error){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             alert("Save failed: "+error.message);
