                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       area.appendChild(card);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }catch(error){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            area.textContent="Error: "+error.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             }
                                                                                                                                                                                                                                                     
                                                                                                                                                                                                                                                     // ===============================
                                                                                                                                                                                                                                                     // PART 3 - ATTENDANCE REPORTS
                                                                                                                                                                                                                                                     // ===============================
                                                                                                                                                                                                                                                     
                                                                                                                                                                                                                                                     function getDateRange(period,date){
                                                                                                                                                                                                                                                      const d=new Date(date+"T00:00:00");
                                                                                                                                                                                                                                                       let start,end;
                                                                                                                                                                                                                                                        if(period==="daily"){
                                                                                                                                                                                                                                                          start=date;
                                                                                                                                                                                                                                                            end=date;
                                                                                                                                                                                                                                                             }else if(period==="weekly"){
                                                                                                                                                                                                                                                               const first=new Date(d);
                                                                                                                                                                                                                                                                 first.setDate(d.getDate()-6);
                                                                                                                                                                                                                                                                   start=localDateFrom(first);
                                                                                                                                                                                                                                                                     end=date;
                                                                                                                                                                                                                                                                      }else{
                                                                                                                                                                                                                                                                        start=date.slice(0,7)+"-01";
                                                                                                                                                                                                                                                                          const last=new Date(d.getFullYear(),d.getMonth()+1,0);
                                                                                                                                                                                                                                                                            end=localDateFrom(last);
                                                                                                                                                                                                                                                                             }
                                                                                                                                                                                                                                                                              return {start,end};
                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                              function localDateFrom(d){
                                                                                                                                                                                                                                                                               return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
                                                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                                               
                                                                                                                                                                                                                                                                               function getStatus(record,prayer){
                                                                                                                                                                                                                                                                                if(!record || !record.prayers || !(prayer in record.prayers)) return "notmarked";
                                                                                                                                                                                                                                                                                 return record.prayers[prayer]===true?"present":"absent";
                                                                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                                                                 
                                                                                                                                                                                                                                                                                 function statusLabel(status){
                                                                                                                                                                                                                                                                                  if(status==="present") return '<span class="present">Present</span>';
                                                                                                                                                                                                                                                                                   if(status==="absent") return '<span class="absent">Absent</span>';
                                                                                                                                                                                                                                                                                    return '<span class="notmarked">Not Marked</span>';
                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                    function reportStats(records,selectedPrayers){
                                                                                                                                                                                                                                                                                     let present=0,absent=0,notmarked=0;
                                                                                                                                                                                                                                                                                      records.forEach(record=>{
                                                                                                                                                                                                                                                                                        selectedPrayers.forEach(p=>{
                                                                                                                                                                                                                                                                                           const status=getStatus(record,p);
                                                                                                                                                                                                                                                                                              if(status==="present") present++;
                                                                                                                                                                                                                                                                                                 else if(status==="absent") absent++;
                                                                                                                                                                                                                                                                                                    else notmarked++;
                                                                                                                                                                                                                                                                                                      });
                                                                                                                                                                                                                                                                                                       });
                                                                                                                                                                                                                                                                                                        const total=present+absent+notmarked;
                                                                                                                                                                                                                                                                                                         const marked=present+absent;
                                                                                                                                                                                                                                                                                                          const rate=marked?Math.round(present/marked*100):0;
                                                                                                                                                                                                                                                                                                           const coverage=total?Math.round(marked/total*100):0;
                                                                                                                                                                                                                                                                                                            return {present,absent,notmarked,total,rate,coverage};
                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                            function statsHTML(s){
                                                                                                                                                                                                                                                                                                             return `
                                                                                                                                                                                                                                                                                                              <div class="reportGrid">
                                                                                                                                                                                                                                                                                                                <div class="reportStat"><h3>${s.present}</h3>Present</div>
                                                                                                                                                                                                                                                                                                                  <div class="reportStat"><h3>${s.absent}</h3>Absent</div>
                                                                                                                                                                                                                                                                                                                    <div class="reportStat"><h3>${s.notmarked}</h3>Not Marked</div>
                                                                                                                                                                                                                                                                                                                      <div class="reportStat"><h3>${s.rate}%</h3>Attendance Rate</div>
                                                                                                                                                                                                                                                                                                                       </div>
                                                                                                                                                                                                                                                                                                                        <p class="small">Marking Coverage: ${s.coverage}% (${s.total-s.notmarked}/${s.total} prayer records marked)</p>`;
                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                        // MEMBER REPORT
                                                                                                                                                                                                                                                                                                                        async function loadMyReport(){
                                                                                                                                                                                                                                                                                                                         if(currentRole!=="member"||!currentUser) return;
                                                                                                                                                                                                                                                                                                                          const area=$("reportList");
                                                                                                                                                                                                                                                                                                                           area.textContent="Loading report...";
                                                                                                                                                                                                                                                                                                                            const date=$("myReportDate").value||localDate();
                                                                                                                                                                                                                                                                                                                             const period=$("reportPeriod").value;
                                                                                                                                                                                                                                                                                                                              const range=getDateRange(period,date);
                                                                                                                                                                                                                                                                                                                               try{
                                                                                                                                                                                                                                                                                                                                 const q=query(
                                                                                                                                                                                                                                                                                                                                    collection(db,"attendance"),
                                                                                                                                                                                                                                                                                                                                       where("memberId","==",currentUser.uid)
                                                                                                                                                                                                                                                                                                                                         );
                                                                                                                                                                                                                                                                                                                                           const snap=await getDocs(q);
                                                                                                                                                                                                                                                                                                                                             const records=[];
                                                                                                                                                                                                                                                                                                                                               snap.forEach(item=>{
                                                                                                                                                                                                                                                                                                                                                  const data=item.data();
                                                                                                                                                                                                                                                                                                                                                     if(data.date>=range.start&&data.date<=range.end) records.push(data);
                                                                                                                                                                                                                                                                                                                                                       });
                                                                                                                                                                                                                                                                                                                                                         records.sort((a,b)=>a.date.localeCompare(b.date));
                                                                                                                                                                                                                                                                                                                                                           const stats=reportStats(records,prayers);
                                                                                                                                                                                                                                                                                                                                                             let html=`<h3>${range.start} to ${range.end}</h3>`;
                                                                                                                                                                                                                                                                                                                                                               html+=statsHTML(stats);
                                                                                                                                                                                                                                                                                                                                                                 html+='<div class="scroll"><table class="reportTable"><tr><th>Date</th>';
                                                                                                                                                                                                                                                                                                                                                                   prayers.forEach(p=>html+=`<th>${p.toUpperCase()}</th>`);
                                                                                                                                                                                                                                                                                                                                                                     html+='</tr>';
                                                                                                                                                                                                                                                                                                                                                                       const byDate={};
                                                                                                                                                                                                                                                                                                                                                                         records.forEach(r=>byDate[r.date]=r);
                                                                                                                                                                                                                                                                                                                                                                           const dates=Object.keys(byDate).sort();
                                                                                                                                                                                                                                                                                                                                                                             dates.forEach(date=>{
                                                                                                                                                                                                                                                                                                                                                                                html+=`<tr><td>${date}</td>`;
                                                                                                                                                                                                                                                                                                                                                                                   prayers.forEach(p=>{
                                                                                                                                                                                                                                                                                                                                                                                       html+=`<td>${statusLabel(getStatus(byDate[date],p))}</td>`;
                                                                                                                                                                                                                                                                                                                                                                                          });
                                                                                                                                                                                                                                                                                                                                                                                             html+='</tr>';
                                                                                                                                                                                                                                                                                                                                                                                               });
                                                                                                                                                                                                                                                                                                                                                                                                 html+='</table></div>';
                                                                                                                                                                                                                                                                                                                                                                                                   if(!dates.length) html+='<p>No attendance records found for this period.</p>';
                                                                                                                                                                                                                                                                                                                                                                                                     area.innerHTML=html;
                                                                                                                                                                                                                                                                                                                                                                                                      }catch(error){
                                                                                                                                                                                                                                                                                                                                                                                                        area.textContent="Report error: "+error.message;
                                                                                                                                                                                                                                                                                                                                                                                                         }
                                                                                                                                                                                                                                                                                                                                                                                                         }
                                                                                                                                                                                                                                                                                                                                                                                                         $("loadMyReport").onclick=loadMyReport;
                                                                                                                                                                                                                                                                                                                                                                                                         $("reportPeriod").onchange=loadMyReport;
                                                                                                                                                                                                                                                                                                                                                                                                         $("myReportDate").onchange=loadMyReport;
                                                                                                                                                                                                                                                                                                                                                                                                         
                                                                                                                                                                                                                                                                                                                                                                                                         // MOSQUE-WIDE REPORT
                                                                                                                                                                                                                                                                                                                                                                                                         async function loadMosqueReport(){
                                                                                                                                                                                                                                                                                                                                                                                                          if(currentRole!=="admin"&&currentRole!=="mentor") return;
                                                                                                                                                                                                                                                                                                                                                                                                           const area=$("mosqueReportResults");
                                                                                                                                                                                                                                                                                                                                                                                                            area.textContent="Loading mosque report...";
                                                                                                                                                                                                                                                                                                                                                                                                             const date=$("mosqueReportDate").value||localDate();
                                                                                                                                                                                                                                                                                                                                                                                                              const period=$("mosquePeriod").value;
                                                                                                                                                                                                                                                                                                                                                                                                               const chosen=$("mosquePrayer").value;
                                                                                                                                                                                                                                                                                                                                                                                                                const range=getDateRange(period,date);
                                                                                                                                                                                                                                                                                                                                                                                                                 const selectedPrayers=chosen==="all"?prayers:[chosen];
                                                                                                                                                                                                                                                                                                                                                                                                                  try{
                                                                                                                                                                                                                                                                                                                                                                                                                    const [userSnap,attendanceSnap]=await Promise.all([
                                                                                                                                                                                                                                                                                                                                                                                                                       getDocs(collection(db,"users")),
                                                                                                                                                                                                                                                                                                                                                                                                                          getDocs(collection(db,"attendance"))
                                                                                                                                                                                                                                                                                                                                                                                                                            ]);
                                                                                                                                                                                                                                                                                                                                                                                                                              const approvedMembers=[];
                                                                                                                                                                                                                                                                                                                                                                                                                                userSnap.forEach(item=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                   const u=item.data();
                                                                                                                                                                                                                                                                                                                                                                                                                                      if(u.approved&&u.role==="member"){
                                                                                                                                                                                                                                                                                                                                                                                                                                          approvedMembers.push({id:item.id,...u});
                                                                                                                                                                                                                                                                                                                                                                                                                                             }
                                                                                                                                                                                                                                                                                                                                                                                                                                               });
                                                                                                                                                                                                                                                                                                                                                                                                                                                 const records=[];
                                                                                                                                                                                                                                                                                                                                                                                                                                                   attendanceSnap.forEach(item=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                      const r=item.data();
                                                                                                                                                                                                                                                                                                                                                                                                                                                         if(r.date>=range.start&&r.date<=range.end) records.push(r);
                                                                                                                                                                                                                                                                                                                                                                                                                                                           });
                                                                                                                                                                                                                                                                                                                                                                                                                                                           
                                                                                                                                                                                                                                                                                                                                                                                                                                                             const recordsByMemberDate={};
                                                                                                                                                                                                                                                                                                                                                                                                                                                               records.forEach(r=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  recordsByMemberDate[r.memberId+"_"+r.date]=r;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const stats=reportStats(records,selectedPrayers);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let html=`<h3>${range.start} to ${range.end}</h3>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          html+=`<p>Approved Members: <b>${approvedMembers.length}</b></p>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            html+=statsHTML(stats);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              html+='<h3>Prayer-wise Summary</h3>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                html+='<div class="scroll"><table class="reportTable"><tr><th>Prayer</th><th>Present</th><th>Absent</th><th>Not Marked</th></tr>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  selectedPrayers.forEach(p=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     let present=0,absent=0,notmarked=0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        records.forEach(r=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const s=getStatus(r,p);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if(s==="present")present++;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    else if(s==="absent")absent++;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        else notmarked++;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              html+=`<tr><td>${prayerNames[p]}</td><td>${present}</td><td>${absent}</td><td>${notmarked}</td></tr>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  html+='</table></div>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    html+='<h3>Member-wise Report</h3>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      html+='<div class="scroll"><table class="reportTable"><tr><th>Member</th><th>Present</th><th>Absent</th><th>Not Marked</th></tr>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        approvedMembers.forEach(member=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           const memberRecords=records.filter(r=>r.memberId===member.id);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const s=reportStats(memberRecords,selectedPrayers);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 html+=`<tr><td>${escapeHTML(member.name)}</td><td>${s.present}</td><td>${s.absent}</td><td>${s.notmarked}</td></tr>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     html+='</table></div>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       html+='<h3>Absent Members</h3>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         selectedPrayers.forEach(p=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            html+=`<div class="statusList"><b>${prayerNames[p]}</b>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               let found=false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  approvedMembers.forEach(member=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const dates=Object.keys(recordsByMemberDate).filter(key=>key.startsWith(member.id+"_"));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          dates.forEach(key=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               const r=recordsByMemberDate[key];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(getStatus(r,p)==="absent"){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          html+=`<p class="absent">${escapeHTML(member.name)} — ${r.date}</p>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                found=true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     }
